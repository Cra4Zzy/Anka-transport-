<form id="request-form"><div class="form-heading"><span>Ihr geplanter Festeinsatz</span><small>* Pflichtangabe</small></div><fieldset><legend>Welche Fahrzeugklasse benötigen Sie? *</legend><div class="vehicle-choice"><label><input type="radio" name="fahrzeug" value="7,5-Tonner" required><span>7,5 t</span></label><label><input type="radio" name="fahrzeug" value="12-Tonner"><span>12 t</span></label><label><input type="radio" name="fahrzeug" value="18-Tonner"><span>18 t</span></label><label><input type="radio" name="fahrzeug" value="Sattelzüge"><span>Sattelzug</span></label><label><input type="radio" name="fahrzeug" value="Noch abzustimmen"><span>Noch offen</span></label></div></fieldset><div class="form-grid"><label>Einsatzort *<input name="einsatzort" placeholder="Ort oder Region" required maxlength="180"></label><label>Geplanter Start<input name="start" type="date"></label></div><label>Touren, Einsatzzeiten & Laufzeit<textarea name="details" rows="3" placeholder="Erzählen Sie uns kurz, welchen Einsatz Sie planen." maxlength="5000"></textarea></label><h3 class="form-subheading">Ihre Kontaktdaten</h3><div class="form-grid"><label>Unternehmen *<input name="unternehmen" autocomplete="organization" placeholder="Ihr Unternehmen" required maxlength="180"></label><label>Ansprechperson *<input name="name" autocomplete="name" placeholder="Vor- und Nachname" required maxlength="120"></label><label>E-Mail *<input type="email" name="email" autocomplete="email" placeholder="name@unternehmen.de" required maxlength="180"></label><label>Telefon<input name="telefon" type="tel" autocomplete="tel" placeholder="Für persönliche Rückfragen" maxlength="60"></label></div><p class="form-info">Bereiten Sie Ihre Anfrage für das persönliche Gespräch vor. Ihre Angaben werden nicht über dieses Formular versendet.</p><button class="button form-submit" type="submit">Anfrage vorbereiten</button><p class="form-privacy">Ihre Angaben bleiben in Ihrem Browser. <button type="button" data-dialog="datenschutz">Datenschutzhinweise</button></p></form>
